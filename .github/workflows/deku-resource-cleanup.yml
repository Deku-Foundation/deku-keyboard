name: One-time localization cleanup for Deku

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deku-resource-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: deku-keyboard-localization-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Deku-Foundation/deku-keyboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Remove obsolete add-ons-store copy from localized resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          obsolete_keys = (
              "ext__home__info",
              "ext__home__visit_store",
              "ext__update_box__internet_permission_hint",
          )

          def update_value(text, key, value):
              pattern = re.compile(
                  r'(<string\b(?=[^>]*\bname="' + re.escape(key) +
                  r'")[^>]*>).*?(</string>)',
                  re.DOTALL,
              )
              updated, count = pattern.subn(
                  lambda match: match.group(1) + value + match.group(2),
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f"Expected exactly one base resource for {key}; found {count}")
              return updated

          def remove_value(text, key):
              pattern = re.compile(
                  r'^[ \t]*<string\b(?=[^>]*\bname="' + re.escape(key) +
                  r'")[^>]*>.*?</string>[ \t]*(?:\r?\n|$)',
                  re.MULTILINE | re.DOTALL,
              )
              return pattern.subn("", text)

          base = root / "app/src/main/res/values/strings.xml"
          base_text = base.read_text(encoding="utf-8")
          base_text = update_value(
              base_text,
              "ext__home__info",
              "Import extension files from sources you trust. The Deku online add-ons service is not available yet.",
          )
          base_text = update_value(
              base_text,
              "ext__update_box__internet_permission_hint",
              "Until Deku offers an online extension update service, check releases from the extension publisher before updating manually.",
          )
          base_text, removed_store_button = remove_value(base_text, "ext__home__visit_store")
          if removed_store_button != 1:
              raise RuntimeError(f"Expected to remove one unused base store button string; removed {removed_store_button}")
          base.write_text(base_text, encoding="utf-8")

          removed = 0
          modified = 0
          for file in (root / "app/src/main/res").glob("values-*/strings.xml"):
              content = file.read_text(encoding="utf-8")
              before = content
              for key in obsolete_keys:
                  content, count = remove_value(content, key)
                  removed += count
              if content != before:
                  file.write_text(content, encoding="utf-8")
                  modified += 1
                  print(f"Updated {file.relative_to(root)}")

          print(f"Updated base resources, removed {removed} obsolete localized strings from {modified} files.")
          PY

      - name: Commit localization cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values/strings.xml app/src/main/res/values-*/strings.xml
          if git diff --cached --quiet; then
            echo "No localization changes were required."
            exit 0
          fi
          git commit -m "Remove obsolete upstream add-ons-store strings"
          git push origin HEAD:main
