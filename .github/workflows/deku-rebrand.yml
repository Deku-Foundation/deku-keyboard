name: One-time Deku identity migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deku-rebrand.yml"
      - ".github/scripts/rebrand.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deku-keyboard-identity-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'Deku-Foundation/deku-keyboard'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Repackage namespaces, symbols, resources, and text
        run: python3 .github/scripts/rebrand.py

      - name: Validate and commit migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected after migration."
            exit 1
          fi
          git commit -m "Rebrand package namespaces and source identity for Deku Keyboard"
          git push origin HEAD:main

      - name: Summarize migration
        if: always()
        shell: bash
        run: |
          {
            echo "## Deku Keyboard identity migration"
            echo
            echo "The repository rebrand script was run. Review BRANDING_MIGRATION.md and the Android CI result before continuing development."
          } >> "$GITHUB_STEP_SUMMARY"
