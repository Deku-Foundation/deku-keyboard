name: Bootstrap Deku Keyboard source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deku-import-archive.yml"

permissions:
  contents: write

concurrency:
  group: deku-keyboard-source-import
  cancel-in-progress: false

jobs:
  import-source:
    if: github.repository == 'Deku-Foundation/deku-keyboard'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Validate and extract source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from tempfile import TemporaryDirectory
          import shutil
          import stat
          import zipfile

          root = Path.cwd()
          archive = root / "florisboard-main.zip"
          if not archive.is_file():
              raise SystemExit("Required archive florisboard-main.zip was not found.")

          with TemporaryDirectory(prefix="deku-keyboard-import-") as temp_name:
              temp = Path(temp_name)
              extracted = temp / "extracted"
              extracted.mkdir()
              workflow = root / ".github" / "workflows" / "deku-import-archive.yml"
              workflow_backup = temp / "deku-import-archive.yml"
              if workflow.is_file():
                  shutil.copy2(workflow, workflow_backup)

              with zipfile.ZipFile(archive) as zf:
                  bad_member = zf.testzip()
                  if bad_member is not None:
                      raise SystemExit(f"ZIP integrity check failed at: {bad_member}")
                  infos = zf.infolist()
                  if not infos or len(infos) > 50000:
                      raise SystemExit(f"Unexpected ZIP entry count: {len(infos)}")
                  total_size = sum(info.file_size for info in infos)
                  if total_size > 1_500_000_000:
                      raise SystemExit(f"Refusing archive with {total_size} uncompressed bytes.")

                  for info in infos:
                      name = info.filename
                      path = PurePosixPath(name)
                      if path.is_absolute() or ".." in path.parts or "\\" in name:
                          raise SystemExit(f"Unsafe ZIP entry path: {name!r}")
                      mode = (info.external_attr >> 16) & 0o177777
                      if stat.S_ISLNK(mode):
                          raise SystemExit(f"Symbolic link in ZIP is not allowed: {name!r}")
                      if not path.parts:
                          continue
                      target = extracted.joinpath(*path.parts)
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info, "r") as source, target.open("wb") as dest:
                          shutil.copyfileobj(source, dest)
                      permissions = (info.external_attr >> 16) & 0o777
                      if permissions:
                          target.chmod(permissions)

              top_level = {PurePosixPath(info.filename).parts[0]
                           for info in infos if PurePosixPath(info.filename).parts}
              source = extracted
              if len(top_level) == 1:
                  candidate = extracted / next(iter(top_level))
                  if candidate.is_dir() and (candidate / "gradlew").is_file() and (candidate / "app").is_dir():
                      source = candidate

              if not (source / "gradlew").is_file() or not (source / "app").is_dir():
                  raise SystemExit("Archive extracted, but Android project markers (gradlew and app/) were not found.")

              for child in list(root.iterdir()):
                  if child.name in {".git", archive.name}:
                      continue
                  if child.is_dir() and not child.is_symlink():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

              for child in source.iterdir():
                  if child.name == ".git":
                      continue
                  destination = root / child.name
                  if child.is_dir():
                      shutil.copytree(child, destination, dirs_exist_ok=True)
                  else:
                      shutil.copy2(child, destination)

              if workflow_backup.is_file():
                  restored = root / ".github" / "workflows" / "deku-import-archive.yml"
                  restored.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(workflow_backup, restored)

              (root / "gradlew").chmod(0o755)
              archive.unlink()
              print(f"Extracted {len(infos)} entries from {archive.name}; removed ZIP after validation.")
          PY

      - name: Apply initial Deku Keyboard project identity
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Deku Keyboard

          **Deku Keyboard** is an open-source Android keyboard project maintained by [Deku Foundation](https://github.com/Deku-Foundation).

          This repository begins from the [FlorisBoard](https://github.com/florisboard/florisboard) open-source codebase and will be developed independently. The current baseline retains upstream implementation and third-party components; the project will be rebranded and modernized in reviewed stages rather than by indiscriminate search-and-replace.

          [![Deku Keyboard CI](https://github.com/Deku-Foundation/deku-keyboard/actions/workflows/android.yml/badge.svg?branch=main)](https://github.com/Deku-Foundation/deku-keyboard/actions/workflows/android.yml)

          ## Project status

          This is the source-import baseline, not a published stable release. The first goal is to establish a reproducible build and CI. Application identifiers, signing, release distribution, remaining in-app branding, and visual assets will be reviewed before a public Deku release. Do not treat unofficial builds as production releases.

          ## Baseline capabilities

          The imported codebase includes the upstream keyboard features and architecture, including theme customization, clipboard history, emoji input, and extension support. Feature availability and quality will be revalidated during development.

          ## Build locally

          Requirements and toolchain details are defined by the Gradle wrapper and the CI workflow. From the repository root, run:

          ```bash
          ./gradlew clean assembleDebug
          ```

          The debug APK is generated at app/build/outputs/apk/debug/app-debug.apk when the build succeeds.

          ## Attribution and licensing

          This project is derived from FlorisBoard and retains its upstream license, copyright statements, and applicable third-party notices. See [LICENSE](LICENSE) and [UPSTREAM.md](UPSTREAM.md). Deku Keyboard is an independent project and is not the official FlorisBoard project.
          EOF

          cat > UPSTREAM.md <<'EOF'
          # Upstream attribution

          The initial source baseline in this repository was imported from the public FlorisBoard repository:

          - Upstream project: https://github.com/florisboard/florisboard
          - Imported source branch: main
          - Upstream license: Apache License 2.0 (see LICENSE)

          Deku Keyboard is an independent derivative project maintained by Deku Foundation. Existing upstream copyright and license notices are retained with the source. Changes and new work will be documented as development progresses. This project does not claim ownership of upstream contributions or imply endorsement by the upstream maintainers.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          resources = Path("app/src/main/res")
          if resources.is_dir():
              pattern = re.compile(
                  r'(<string\b[^>]*\bname=["\']app_name["\'][^>]*>)(.*?)(</string>)',
                  re.DOTALL
              )
              for file in resources.glob("values*/strings.xml"):
                  text = file.read_text(encoding="utf-8")
                  def replace(match):
                      value = re.sub(r"<[^>]*>", "", match.group(2)).strip()
                      return match.group(1) + "Deku Keyboard" + match.group(3) if value == "FlorisBoard" else match.group(0)
                  updated = pattern.sub(replace, text)
                  if updated != text:
                      file.write_text(updated, encoding="utf-8")
                      print(f"Updated app label in {file}")
          PY

      - name: Copy and adapt upstream GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows docs/automation
          if curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/florisboard/florisboard/main/.github/workflows/android.yml \
            -o /tmp/upstream-android.yml; then
            cp /tmp/upstream-android.yml .github/workflows/android.yml
          fi
          if curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/florisboard/florisboard/main/.github/workflows/validate-strings-no-translations.yml \
            -o /tmp/upstream-validate.yml; then
            cp /tmp/upstream-validate.yml .github/workflows/validate-strings-no-translations.yml
          fi
          if curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/florisboard/florisboard/main/.github/workflows/crowdin-upload.yml \
            -o /tmp/upstream-crowdin.yml; then
            cp /tmp/upstream-crowdin.yml docs/automation/crowdin-upload.yml.disabled
          elif [ -f .github/workflows/crowdin-upload.yml ]; then
            cp .github/workflows/crowdin-upload.yml docs/automation/crowdin-upload.yml.disabled
          fi
          rm -f .github/workflows/crowdin-upload.yml

          python3 - <<'PY'
          from pathlib import Path

          android = Path(".github/workflows/android.yml")
          if android.is_file():
              text = android.read_text(encoding="utf-8")
              text = text.replace("name: FlorisBoard CI", "name: Deku Keyboard CI")
              text = text.replace("actions/checkout@v4", "actions/checkout@v7")
              text = text.replace("actions/setup-java@v4", "actions/setup-java@v6")
              text = text.replace("actions/upload-artifact@v4", "actions/upload-artifact@v7")
              android.write_text(text, encoding="utf-8")

          validation = Path(".github/workflows/validate-strings-no-translations.yml")
          if validation.is_file():
              text = validation.read_text(encoding="utf-8")
              text = text.replace(
                  "name: Validate no translated strings.xml included",
                  "name: Deku Keyboard - validate base string resources"
              )
              text = text.replace("florisboard-bot", "deku-keyboard-bot")
              text = text.replace(
                  "https://github.com/florisboard/florisboard/blob/main/CONTRIBUTING.md#translation",
                  "https://github.com/Deku-Foundation/deku-keyboard/blob/main/CONTRIBUTING.md#translation"
              )
              validation.write_text(text, encoding="utf-8")
          PY

          cat > docs/automation/README.md <<'EOF'
          # GitHub Actions integration notes

          - android.yml runs the Android debug build and publishes the APK as a workflow artifact.
          - validate-strings-no-translations.yml carries the upstream validation for localized strings.xml changes.
          - crowdin-upload.yml.disabled is retained as a reference only. It is intentionally not an active workflow because the upstream Crowdin project and its secrets do not belong to this repository. Enable a translation integration only after configuring Deku-owned credentials and project settings.
          EOF

      - name: Commit extracted source and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deku-import-archive.yml florisboard-main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "Import FlorisBoard source as Deku Keyboard baseline"
          git push origin HEAD:main

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Build debug APK
        run: ./gradlew clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: deku-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
